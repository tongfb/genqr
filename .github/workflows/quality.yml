name: Test and build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - name: Verify patched Node.js 24
        run: |
          node -e 'const [major, minor, patch] = process.versions.node.split(".").map(Number); console.log(`Node.js v${process.versions.node}; minimum v24.22.1`); if (major !== 24 || minor < 22 || (minor === 22 && patch < 1)) process.exit(1)'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Build production files
        run: pnpm build
